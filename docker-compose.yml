# ============================================================
# new_bird - Docker Compose (Development)
# ============================================================

services:
  postgres:
    image: postgres:18-alpine
    container_name: mbird_postgres
    environment:
      POSTGRES_DB: mbird_reports
      POSTGRES_USER: mbird
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mbird_dev_2024}
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mbird -d mbird_reports"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mbird_api
    profiles:
      - dev
    command: >
      uvicorn api.main:app --reload --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mbird:${DB_PASSWORD:-mbird_dev_2024}@postgres:5432/mbird_reports
      CORS_ORIGINS: https://zscan-sac.eajdias.com,https://zsc-sac.eajdias.com,http://localhost:3050
      SYNC_PROFILE: ${SYNC_PROFILE:-daily}
      SYNC_ENABLED: ${SYNC_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_ENV: ${APP_ENV:-production}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8050:8000"
    mem_limit: 1g
    volumes:
      - ./api:/app/api
      - ./domain:/app/domain
      - ./application:/app/application
      - ./infrastructure:/app/infrastructure
      - ./reports:/app/reports
      - ./business_config.yaml:/app/business_config.yaml
      - ./business_bsc.yaml:/app/business_bsc.yaml
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://127.0.0.1:8000/api/v1/admin/health').raise_for_status()\""]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mbird_api_prod
    profiles:
      - prod
    command: >
      uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 2
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mbird:${DB_PASSWORD:-mbird_dev_2024}@postgres:5432/mbird_reports
      CORS_ORIGINS: https://zscan-sac.eajdias.com,https://zsc-sac.eajdias.com,http://localhost:3050
      SYNC_PROFILE: ${SYNC_PROFILE:-daily}
      SYNC_ENABLED: ${SYNC_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8050:8000"
    mem_limit: 2g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://127.0.0.1:8000/api/v1/admin/health').raise_for_status()\""]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mbird_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3050:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
